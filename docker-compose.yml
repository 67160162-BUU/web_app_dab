services:
  # --------------------------------------------------------
  # 1. PostgreSQL Database Service
  # --------------------------------------------------------
  db_postgres:
    image: postgres:15-alpine
    container_name: dance_detector_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: dance_detector
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dance_detector"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  # --------------------------------------------------------
  # 2. MySQL Database Service (for phpMyAdmin)
  # --------------------------------------------------------
  db_mysql:
    image: mysql:8.0
    container_name: dance_detector_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dance_detector
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --------------------------------------------------------
  # 3. phpMyAdmin Web Interface (Access at http://localhost:8080)
  # --------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: dance_detector_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db_mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    ports:
      - "${PMA_PORT:-8080}:80"
    depends_on:
      db_mysql:
        condition: service_healthy

  # --------------------------------------------------------
  # 4. FastAPI Web Backend Service
  # Switch DB_TYPE between 'postgres' and 'mysql'
  # --------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dance_detector_web
    restart: always
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      # Options: 'postgres' (default) or 'mysql'
      DB_TYPE: ${DB_TYPE:-postgres}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword}
      DB_NAME: ${DB_NAME:-dance_detector}
      IS_DOCKER: "true"
    depends_on:
      db_postgres:
        condition: service_healthy
      db_mysql:
        condition: service_healthy

volumes:
  pg_data:
  mysql_data:


